max_optimizer_steps: 50
checkpoints: [0, 25, 50]
train_data_count: 2000 single (Q,P,E,A) [answer-in-plan filtered] + 20 verified pairs
verified_pair_train_count: 20
verified_pair_eval_count: 8
lambda_rank: 0.1   # ranking on the first 64 execution targets, same implementation as the bridge / LoRA pilots
loss_per_rank_step: (4 single CE + CE(E_A|Z_A) + CE(E_B|Z_B)) / 6 + 0.1 * rank(1 pair)
lr_adapter: 1.0e-4
lr_lora: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
max_execution_tokens: 3072 (no sample exceeded; max 1993)
num_gpus: 2 (torchrun, manual all-reduce of trainable grads = DDP mean)
global_batch: 8 singles + 2 pairs per optimizer step
rl_enabled: false

# OUR Stage 2 (deterministic latent plan distillation). NOT LaTER's internal train_stage=2 curriculum.
# Every key below is consumed by later/src/train/train_stage2.py (validated at start-up).
objective_mode: plan_distill_stage2
model_path: /scratch/hz33227/e2c/Explore-Execute-Chain/outputs/e2c_qwen3_4b_sft/best_hf          # Stage-1 E2C SFT step 800
reference_teacher_path: /scratch/hz33227/e2c/Explore-Execute-Chain/outputs/e2c_qwen3_4b_sft/best_hf
train_data: /scratch/hz33227/e2c/stage2/data/stage2_train.parquet
val_data: /scratch/hz33227/e2c/stage2/data/stage2_val.parquet
reference_cache_dir: /scratch/hz33227/e2c/stage2/teacher_cache
output_dir: /scratch/hz33227/e2c/stage2/runs/stage2_L8_full
data_source_policy: stage1_sft_only
allow_later69k_mixing: false
require_stage1_data_audit: true

latent_steps: 8                    # smoke-test starting point, not a final research value
latent_embed_builder_no_grad: false
latent_projector_dropout: 0.0
latent_projector_output_rms: token_embedding   # rescale latents to token-embedding scale (see report: without it
                                               # latents had ~80x the token-embedding norm and were ignored)
global_stateless_forward: true
alignment_layers: all              # decoder-layer outputs 1..36 (pre final norm); ablations: last4 / last8
alignment_distance: normalized_l1
alignment_epsilon: 1.0e-6
alignment_scale: teacher_std       # std over hidden dim, correction=0, per sample & layer

lambda_a: 0.1                      # smoke-only placeholder, needs a sweep
lambda_r: 0.3                      # smoke-only placeholder, needs a sweep
execution_ce_weight: 1.0
teacher_kl_enabled: false
kl_loss_weight: 0.0
halting_loss_enabled: false
halt_dense_loss_stage1_weight: 0.0
halt_dense_loss_stage2_final_weight: 0.0
noise_std: 0.0
rl_enabled: false

# optimisation (2x B200, DDP, fp32 master weights + bf16 autocast)
master_dtype: float32
attn_implementation: sdpa
gradient_checkpointing: false
micro_batch_size: 1
gradient_accumulation_steps: 8     # global batch = 1 x 8 x 2 GPUs = 16
max_length: 4096
learning_rate: 1.0e-5
latent_projector_lr: 1.0e-4        # new randomly initialised module
adam_betas: [0.9, 0.95]
weight_decay: 0.01
warmup_steps: 10
max_grad_norm: 1.0
max_train_steps: 2900               # ≈ 1 epoch of 46,510 records at global batch 16
save_every_steps: 500              # only used when save_steps is empty
save_steps: [500, 1500, 2900]      # checkpoint + generation eval
eval_every_steps: 250
eval_max_batches: 50               # per rank (micro-batches)
log_every_steps: 1
debug_latent_grad_every: 5
seed: 1234
resume: true

# ---- monitoring / W&B (logging only; does not change the training math) ----
wandb: true
wandb_project: stage2-plan-distill
wandb_entity: zhaomichaelk-university-of-georgia
stage1_hf_repo: zhaohq/Qwen3-4B-E2C-SFT-only
stage1_hf_revision: a6b0e2fe008f14b00bf7f3a29a214e96212f7251   # main = step 800
wandb_loss_every: 10
wandb_grad_every: 20
probe_every_steps: 250             # fixed-val latent probe + projector gradient split
probe_n: 128                       # first 128 val records (fixed)
probe_batch_size: 8                # >= 2 required for shuffled latents
grad_split_batch_size: 4
gen_eval_data: /scratch/hz33227/e2c/stage2/data/clean_math_eval.parquet   # 50 MATH-500, 13-gram clean vs E2C SFT
gen_eval_n: 50
gen_eval_conditions: [learned, zero, shuffled, explicit]
gen_eval_max_new_tokens: 3072      # same decoding protocol as later/src/eval/eval_stage2.py (greedy)
gen_eval_batch_size: 25

# ======== Execution-KL controlled pilot (overrides; appended after the main Stage-2 config) ========
resume_from_checkpoint: /scratch/hz33227/e2c/stage2/runs/stage2_L8_rms_2900/checkpoint-500   # same start for A and B
max_train_steps: 800                 # +300 optimizer steps from step 500
lr_schedule_max_steps: 2900          # keep the original cosine horizon
save_steps: [800]
probe_every_steps: 100
probe_at_start: true                 # step-500 baseline in each run
eval_every_steps: 100
teacher_cache_manifest_dir: /scratch/hz33227/e2c/stage2/exec_kl_pilot/teacher_topk   # val_probe used for eval in A and B
kl_token_budget: 128
execution_kl_temperature: 1.0
wandb_group: stage2_exec_kl_pilot
pilot_group: stage2_exec_kl_pilot
output_dir: /scratch/hz33227/e2c/stage2/runs/pilot_A_three_loss
wandb_run_name: pilot-A-three-loss-500to800
wandb_tags: [pilot, group-A, three-loss]
execution_kl_enabled: false
lambda_kl: 0.0

# OUR Stage 2 (deterministic latent plan distillation). NOT LaTER's internal train_stage=2 curriculum.
# Every key below is consumed by later/src/train/train_stage2.py (validated at start-up).
objective_mode: plan_distill_stage2
model_path: /scratch/hz33227/e2c/Explore-Execute-Chain/outputs/e2c_qwen3_4b_sft/best_hf          # Stage-1 E2C SFT step 800
reference_teacher_path: /scratch/hz33227/e2c/Explore-Execute-Chain/outputs/e2c_qwen3_4b_sft/best_hf
train_data: /scratch/hz33227/e2c/stage2/data/stage2_train.parquet
val_data: /scratch/hz33227/e2c/stage2/data/stage2_val.parquet
reference_cache_dir: /scratch/hz33227/e2c/stage2/teacher_cache
output_dir: /scratch/hz33227/e2c/stage2/runs/stage2_L8_full
data_source_policy: stage1_sft_only
allow_later69k_mixing: false
require_stage1_data_audit: true

latent_steps: 8                    # smoke-test starting point, not a final research value
latent_embed_builder_no_grad: false
latent_projector_dropout: 0.0
latent_projector_output_rms: token_embedding   # rescale latents to token-embedding scale (see report: without it
                                               # latents had ~80x the token-embedding norm and were ignored)
global_stateless_forward: true
alignment_layers: all              # decoder-layer outputs 1..36 (pre final norm); ablations: last4 / last8
alignment_distance: normalized_l1
alignment_epsilon: 1.0e-6
alignment_scale: teacher_std       # std over hidden dim, correction=0, per sample & layer

lambda_a: 0.1                      # smoke-only placeholder, needs a sweep
lambda_r: 0.3                      # smoke-only placeholder, needs a sweep
execution_ce_weight: 1.0
teacher_kl_enabled: false
kl_loss_weight: 0.0
halting_loss_enabled: false
halt_dense_loss_stage1_weight: 0.0
halt_dense_loss_stage2_final_weight: 0.0
noise_std: 0.0
rl_enabled: false

# optimisation (2x B200, DDP, fp32 master weights + bf16 autocast)
master_dtype: float32
attn_implementation: sdpa
gradient_checkpointing: false
micro_batch_size: 1
gradient_accumulation_steps: 8     # global batch = 1 x 8 x 2 GPUs = 16
max_length: 4096
learning_rate: 1.0e-5
latent_projector_lr: 1.0e-4        # new randomly initialised module
adam_betas: [0.9, 0.95]
weight_decay: 0.01
warmup_steps: 10
max_grad_norm: 1.0
max_train_steps: 100
save_every_steps: 50
eval_every_steps: 25
eval_max_batches: 50               # per rank (micro-batches)
log_every_steps: 1
debug_latent_grad_every: 5
seed: 1234
resume: true
